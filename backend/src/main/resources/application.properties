spring.application.name=patient-service
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

server.port=${SERVER_PORT:4000}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/patient_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:change-me}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}

spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

logging.level.root=${ROOT_LOG_LEVEL:INFO}
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n

app.jwt-secret=${APP_JWT_SECRET:ReplaceThisWithASecureSecretKeyBeforeProductionUse1234567890}
app.jwt-expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}
app.bootstrap.admin.email=${APP_BOOTSTRAP_ADMIN_EMAIL:admin@hospital.local}
app.bootstrap.admin.password=${APP_BOOTSTRAP_ADMIN_PASSWORD:ChangeMe123!}
app.bootstrap.admin.name=${APP_BOOTSTRAP_ADMIN_NAME:System Admin}
app.bootstrap.admin.hospital-name=${APP_BOOTSTRAP_ADMIN_HOSPITAL_NAME:Main Hospital}

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:change-me@example.com}
spring.mail.password=${MAIL_PASSWORD:change-me}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

springdoc.swagger-ui.path=/swagger-ui.html

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never
management.info.env.enabled=true

info.app.name=patient-service
info.app.description=Hospital and patient management service prepared for gateway and service discovery
info.app.version=1.0.0

eureka.client.enabled=${EUREKA_ENABLED:false}
eureka.client.service-url.defaultZone=${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
