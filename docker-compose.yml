version: "3.9"

services:
  mysql:
    image: mysql:8.4
    container_name: hospital-mysql
    environment:
      MYSQL_DATABASE: patient_db
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  discovery-server:
    build:
      context: ./microservices/discovery-server
    container_name: discovery-server
    ports:
      - "8761:8761"

  patient-service:
    build:
      context: ./backend
    container_name: patient-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 4000
      DB_URL: jdbc:mysql://mysql:3306/patient_db
      DB_USERNAME: root
      DB_PASSWORD: root
      APP_JWT_SECRET: ThisIsAMyVeryLongSecretKeyForJwtSigning1234567890
      EUREKA_ENABLED: "true"
      EUREKA_DEFAULT_ZONE: http://discovery-server:8761/eureka/
      MAIL_HOST: smtp.gmail.com
      MAIL_PORT: 587
      MAIL_USERNAME: change-me
      MAIL_PASSWORD: change-me
    depends_on:
      mysql:
        condition: service_healthy
      discovery-server:
        condition: service_started
    ports:
      - "4000:4000"

  api-gateway:
    build:
      context: ./microservices/api-gateway
    container_name: api-gateway
    environment:
      SERVER_PORT: 8080
      EUREKA_DEFAULT_ZONE: http://discovery-server:8761/eureka/
    depends_on:
      discovery-server:
        condition: service_started
      patient-service:
        condition: service_started
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
    container_name: hospital-frontend
    depends_on:
      api-gateway:
        condition: service_started
    ports:
      - "3000:80"

volumes:
  mysql-data:
